<!DOCTYPE html>

<html lang="pt-BR">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
CallFlow Dashboard
</title>


<link rel="stylesheet" href="css/global.css">

 <link rel="stylesheet" href="css/dashboard.css">


</head>



<body>



<div class="app">


<aside class="sidebar">


<h2>
CallFlow
</h2>


<p class="subtitle">
ITSM
</p>



<nav>


<a href="dashboard.html">
Dashboard
</a>


<a href="chamados.html">
Chamados
</a>


<a href="arquitetura.html">
 Arquitetura
</a>

 SLA
</a>


<a href="auditoria.html">
 Auditoria
</a>


<a href="relatorios.html">
 Relatórios
</a>



<button onclick="logout()">

Sair

</button>


</nav>


</aside>





<main class="content">


<header class="topbar">

<h1>
 Dashboard Executivo
</h1>


<div id="userInfo">

</div>


</header>




<section class="metrics">


<div class="metric-card">

<h3>
Total Chamados
</h3>

<strong id="totalTickets">
0
</strong>

</div>



<div class="metric-card">

<h3>
Abertos
</h3>

<strong id="openTickets">
0
</strong>

</div>



<div class="metric-card">

<h3>
Em Atendimento
</h3>

<strong id="progressTickets">
0
</strong>

</div>




<div class="metric-card">

<h3>
Resolvidos
</h3>

<strong id="closedTickets">
0
</strong>

</div>



<div class="metric-card danger">

<h3>
SLA Estourado
</h3>

<strong id="slaExpired">
0
</strong>

</div>


</section>





<section class="charts">


<div class="chart-container">

<h2>
Chamados por Status
</h2>


<canvas id="statusChart"></canvas>


</div>





<div class="chart-container">

<h2>
Chamados por Prioridade
</h2>


<canvas id="priorityChart"></canvas>


</div>



</section>




<section class="summary">


<h2>
Resumo Operacional
</h2>


<div id="summaryText">

</div>


</section>


</main>


</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/database.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
